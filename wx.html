<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>正在进入 · 星哥</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="星哥的免费资料库 · 一对一陪跑">
<link rel="icon" href="assets/img/avatar.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#07070B;color:#F5F3F8;
    font-family:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',-apple-system,system-ui,sans-serif;
    line-height:1.7;display:flex;align-items:center;justify-content:center;
    padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));overflow-x:hidden;
  }
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 25% 15%,rgba(94,234,212,.20),transparent 42%),
      radial-gradient(circle at 78% 72%,rgba(139,92,246,.20),transparent 42%),#07070B;}
  .box{position:relative;z-index:1;width:100%;max-width:400px;text-align:center;padding:32px 24px;border-radius:24px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .ico{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;display:grid;place-items:center;
    background:linear-gradient(135deg,#5EEAD4,#34D399);color:#0a1a14;font-size:26px;font-weight:900;
    box-shadow:0 10px 30px rgba(94,234,212,.42);}
  h1{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em;line-height:1.4}
  p.sub{font-size:14px;color:#9E9AAD;margin-bottom:20px;line-height:1.75}
  .spin{margin:26px auto;width:44px;height:44px;border:3px solid rgba(94,234,212,.18);
    border-top-color:#5EEAD4;border-radius:50%;animation:s .9s linear infinite;}
  @keyframes s{to{transform:rotate(360deg)}}
  .qr-wrap{width:100%;max-width:240px;margin:0 auto 16px;aspect-ratio:1;background:#fff;border-radius:16px;padding:12px;
    box-shadow:0 16px 50px rgba(0,0,0,.5);}
  .qr-wrap img{width:100%;height:100%;display:block;object-fit:contain}
  .qr-hint{display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;color:#FFE0A3;font-weight:700;margin-bottom:16px;}
  .qr-hint::before{content:'';width:8px;height:8px;border-radius:50%;background:#FF6F91;box-shadow:0 0 10px #FF6F91;animation:p 1.4s infinite;flex-shrink:0;}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
  .btns{display:flex;flex-direction:column;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 20px;border-radius:999px;font-size:15.5px;font-weight:700;text-decoration:none;transition:transform .15s;}
  .btn:active{transform:scale(.97)}
  .btn-p{background:linear-gradient(135deg,#FFE0A3,#F7C873);color:#1A1206}
  .btn-g{border:1px solid rgba(255,255,255,.18);color:#F5F3F8;background:rgba(255,255,255,.04);font-size:14px;padding:13px 18px}
  .steps{text-align:left;margin-top:20px;padding:15px 17px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
  .steps b{display:block;font-size:13px;color:#FFE0A3;margin-bottom:9px}
  .steps ol{padding-left:19px;font-size:13.5px;color:#C8C5D2}
  .steps li{padding:3px 0}
  .hide{display:none}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);padding:11px 22px;border-radius:999px;
    background:rgba(94,234,212,.96);color:#0a1a14;font-size:13.5px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:20;
    box-shadow:0 8px 24px rgba(94,234,212,.4);white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .inapp-guide{margin:8px auto 18px;width:100%;max-width:260px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:16px 14px;}
  .fake-bar{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 8px 12px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px;}
  .fake-bar i{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.12);display:inline-block}
  .fake-bar i:last-child{background:rgba(94,234,212,.35)}
  .menu{margin:0 auto;width:100%;max-width:180px;background:rgba(255,255,255,.95);border-radius:10px;overflow:hidden;color:#222;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .8s ease infinite alternate;}
  @keyframes pop{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  .menu div{padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06)}
  .menu div:last-child{border-bottom:none}
  .menu .active{background:#F7C873;color:#1A1206}
  .inapp-tip{margin-top:14px;font-size:13px;color:#9E9AAD;line-height:1.65;}
  .inapp-tip strong{color:#FFE0A3}
</style>
</head>
<body>

<div class="box">
  <div class="ico">星</div>

  <!-- 主场景：正在进入我们自己的网站（含知乎/抖音等内置浏览器，先尝试跳首页） -->
  <div id="loading">
    <h1>正在进入星哥的网站…</h1>
    <p class="sub">稍等，马上进入免费资料库</p>
    <div class="spin"></div>
  </div>

  <!-- 兜底：唤起失败 / 被内置浏览器拦截 / 桌面 -->
  <div id="fallback" class="hide">
    <h1 id="fbTitle">请长按下方二维码</h1>
    <p class="sub" id="fbSub">识别后添加星哥微信 · 备注「知乎 + 你的行业」</p>
    <div class="qr-wrap"><img src="assets/img/qrcode.png" alt="星哥微信二维码"></div>
    <div class="qr-hint">↑ 长按上面二维码，识别后添加</div>
    <div class="btns">
      <a class="btn btn-p" id="jumpBtn" href="#">再试一次 · 进入网站 →</a>
      <a class="btn btn-g" id="copyBtn">复制链接，去微信里打开也可</a>
    </div>
    <div class="steps">
      <b>还没进入网站？手动两步：</b>
      <ol>
        <li>点右上角「···」→「在浏览器打开」（知乎/抖音内置浏览器需要这步）</li>
        <li>在 Safari / Chrome 里会自动打开星哥的网站；或长按上方二维码加微信</li>
      </ol>
    </div>
  </div>

  <!-- 微信内打开：长按识别 -->
  <div id="wechatInner" class="hide">
    <h1>长按 3 秒识别二维码</h1>
    <p class="sub">添加星哥微信 · 备注「知乎 + 你的行业」</p>
    <div class="qr-wrap"><img src="assets/img/qrcode.png" alt="星哥微信二维码"></div>
    <div class="qr-hint">↑ 长按上面二维码，识别后添加</div>
  </div>
</div>

<div class="toast" id="toast">链接已复制 · 去微信里打开</div>

<script>
(function () {
  // ★ 核心：跳转到【我们自己做的网站】——复刻对标链接 n.wlfx8.cn 的"链路"（干净跳转、稳开），
  //    但目的地是咱们自己的落地页，绝不是对手的公众号文章
  var SITE = location.origin + '/';   // 当前这个站就是咱们做好的站，跳回首页

  var ua = navigator.userAgent.toLowerCase();
  var isWeixin = ua.indexOf('micromessenger') !== -1;
  var isMobile = /iphone|ipad|ipod|android|harmony|mobile/.test(ua);

  var loading = document.getElementById('loading');
  var fallback = document.getElementById('fallback');
  var wechatInner = document.getElementById('wechatInner');

  function show(id, title) {
    loading.classList.add('hide'); fallback.classList.add('hide'); wechatInner.classList.add('hide');
    document.getElementById(id).classList.remove('hide');
    if (title) document.title = title;
  }

  // 场景1：已经在微信里 → 直接长按识别
  if (isWeixin) { show('wechatInner', '长按识别二维码 · 星哥'); return; }

  // 设置兜底按钮的跳转目标（跳回我们自己的网站）
  document.getElementById('jumpBtn').setAttribute('href', SITE);

  var nojump = new URLSearchParams(location.search).has('nojump');
  var jumped = false;

  function tryJump() {
    if (jumped || nojump) return;
    jumped = true;
    window.location.href = SITE;   // 跳回我们自己的网站首页（知乎/抖音内置浏览器也能正常加载）
  }

  // 非桌面：立刻尝试跳转（知乎/抖音内置浏览器也先试，跳回咱们自己的站）
  if (isMobile) {
    setTimeout(tryJump, 80);
  } else {
    // 桌面：直接显示二维码兜底
    show('fallback', '添加星哥微信');
    return;
  }

  // 1.6s 后仍在页面（跳转被彻底拦截）→ 显示二维码 + 在浏览器打开引导
  setTimeout(function () {
    if (jumped && document.visibilityState === 'visible' && !document.hidden) {
      // 仍停留在当前页说明跳转没成功，给兜底
      loading.classList.add('hide');
      fallback.classList.remove('hide');
      document.title = '添加星哥微信';
    }
  }, 1600);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) jumped = true; // 离开页面说明跳转成功
  });

  // 复制链接
  document.getElementById('copyBtn').addEventListener('click', function () {
    var txt = SITE;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).catch(legacyCopy.bind(null, txt));
    } else legacyCopy(txt);
    var t = document.getElementById('toast'); t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2200);
  });
  function legacyCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
