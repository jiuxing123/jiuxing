<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>正在打开微信 · 星哥</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="添加星哥微信 · 一对一陪跑">
<link rel="icon" href="assets/img/avatar.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#07070B;color:#F5F3F8;
    font-family:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',-apple-system,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));overflow-x:hidden;
  }
  .box{width:100%;max-width:360px;position:relative;z-index:1;padding:32px 24px;border-radius:24px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .spin{margin:0 auto 22px;width:40px;height:40px;border:3px solid rgba(94,234,212,.18);
    border-top-color:#5EEAD4;border-radius:50%;animation:s .9s linear infinite;}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}
  p{font-size:14px;color:#9E9AAD;line-height:1.7}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>正在打开微信…</h1>
  <p>若未自动跳转，请手动打开微信</p>
</div>
<script>
(function () {
  // 直接唤起/跳转微信：该链接会 302 到对应公众号文章。
  // 后续想落到自己的文章，把这里换成你自己的 mp.weixin.qq.com/s/... 即可。
  var WX_OPEN_URL = 'https://n.wlfx8.cn/362e9f';
  window.location.replace(WX_OPEN_URL);
})();
</script>
</body>
</html>
