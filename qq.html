<script>
/* 统计：QQ页打开 + 跳转尝试 */

if(C&&C!=='YOUR_GOATCOUNTER_CODE'){new Image().src='https://'+C+'.goatcounter.com/count?p=/qq-open&event=true&t='+encodeURIComponent(document.title);}})();}catch(e){}

<script>
(function () {
  var QQ_NO = '3072392021';
  var QM_URL = 'https://qm.qq.com/q/tVC1365gyI';
  /* QQ原生协议：直接弹好友名片（穿透知乎/浏览器内置WebView的主力） */
  var QQ_SCHEME = 'mqqapi://card/show_pslcard?src_type=internal&version=1&uin=' + QQ_NO + '&card_type=person&source=qrcode';
  var UA = navigator.userAgent || '';
  function inWeChat() { return /MicroMessenger/i.test(UA); }
  function isMobile() { return /Mobile|Android|iPhone/i.test(UA); }
  function track(p) {
    try{
      if(window.GOATCOUNTER_CODE&&window.GOATCOUNTER_CODE!=='YOUR_GOATCOUNTER_CODE'){
        new Image().src='https://'+window.GOATCOUNTER_CODE+'.goatcounter.com/count?p='+p+'&event=true';
      }
    }catch(e){}
  }

  /* 页面是否已离开（跳QQ成功时 webview 会 pagehide/隐藏） */
  var left = false;
  try{
    window.addEventListener('pagehide', function(){ left = true; }, false);
    document.addEventListener('visibilitychange', function(){ if (document.hidden) left = true; }, false);
  }catch(e){}

  /* 分层唤起：先原生协议直弹名片 → 1.8秒没离开再落官方加好友页 */
  function tryQQ() {
    if (inWeChat()) return;
    track('/qq-jump');
    try { window.location.href = QQ_SCHEME; } catch (e) {}
    setTimeout(function () {
      if (!left) { try { window.location.href = QM_URL; } catch (e) {} }
    }, 1800);
  }

  var open = document.getElementById('openQQ');
  if (inWeChat()) {
    /* 微信内置浏览器拦一切QQ跳转：藏按钮，主推扫码+复制 */
    if (open) open.style.display = 'none';
  } else {
    /* 手机上打开页面自动尝试跳一次；按钮改为防呆重试（阻止默认跳转，走完整分层） */
    if (isMobile()) { setTimeout(tryQQ, 700); }
    if (open) open.onclick = function (e) {
      if (e && e.preventDefault) e.preventDefault(); else return true;
      tryQQ();
      return false;
    };
  }

  /* 一键复制QQ号（老内核 execCommand 兜底） */
  var btn = document.getElementById('copyBtn');
  if (btn) btn.onclick = function () {
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = QQ_NO;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}
    if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(QQ_NO);
      ok = true;
    }
    btn.textContent = ok ? '已复制，去QQ粘贴搜索' : '复制失败，请手动输入';
    setTimeout(function () { btn.textContent = '一键复制QQ号'; }, 2000);
  };
})();
</script>
